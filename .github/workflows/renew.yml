name: Katabump Auto Renew (多账号)

on:
  schedule:
    - cron: '0 11 * * *'  # 每天 UTC 11:00 = 北京时间 19:00
  workflow_dispatch:

jobs:
  # ===== 发现所有账号，构建矩阵 =====
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      last: ${{ steps.set-matrix.outputs.last }}
    steps:
    - name: 🎲 读取账号列表
      id: set-matrix
      shell: bash
      env:
        # 从 GitHub Variables 读取账号序号列表（逗号分隔），如 "1,2,3"
        ACCOUNT_INDICES: ${{ vars.KATABUMP_ACCOUNTS || '' }}
      run: |
        if [ -n "$ACCOUNT_INDICES" ]; then
          INDICES=$(echo "$ACCOUNT_INDICES" | tr ',' '\n' | shuf | jq -R . | jq -s -c .)
          LAST=$(echo "$ACCOUNT_INDICES" | awk -F',' '{print $NF}' | xargs)
          echo "matrix=$INDICES" >> $GITHUB_OUTPUT
          echo "last=$LAST" >> $GITHUB_OUTPUT
          echo "✅ 发现 $(echo "$ACCOUNT_INDICES" | tr ',' '\n' | wc -l) 个账号: $ACCOUNT_INDICES"
        else
          # 兼容旧版单账号
          echo "⚠️ 未设置 KATABUMP_ACCOUNTS Variable，尝试单账号模式..."
          echo "matrix=[\"single\"]" >> $GITHUB_OUTPUT
          echo "last=single" >> $GITHUB_OUTPUT
        fi

  # ===== 每个账号依次执行续期 =====
  renew:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        account_index: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v6

    - name: ⚙ 设置 Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: 🛠️ 安装系统依赖和python依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: ⚙ 设置代理 (sing-box)
      continue-on-error: true
      env:
        NODE_LINK: ${{ secrets.NODE_LINK }}
      run: |
        bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

    - name: 🚀 运行账号 ${{ matrix.account_index }} 续期
      env:
        ACC: ${{ secrets[format('KATABUMP_EML_{0}', matrix.account_index)] || secrets.KATABUMP_EMAIL }}
        ACC_PWD: ${{ secrets[format('KATABUMP_PWD_{0}', matrix.account_index)] || secrets.KATABUMP_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        echo "📋 开始处理账号索引: ${{ matrix.account_index }}"
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 app.py

    - name: ⏸️ 10分钟间隔等待
      if: matrix.account_index != 'single' && matrix.account_index != needs.setup.outputs.last
      run: |
        echo "⏸️ 账号 ${{ matrix.account_index }} 续期完成，等待 10 分钟后执行下一个账号..."
        sleep 600

    - name: 🧹 清理旧的工作流运行记录
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
        count=0
        for run_id in $runs; do
          count=$((count + 1))
          if [ $count -gt 1 ]; then
            echo "删除运行记录: $run_id"
            gh run delete $run_id || true
          fi
        done