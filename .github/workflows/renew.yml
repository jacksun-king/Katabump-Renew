name: Katabump Auto Renew (多账号)

on:
  schedule:
    - cron: '0 23 * * *'  # 每天 UTC 23:00 = 北京时间 07:00（早上7点）
  workflow_dispatch: # 允许手动触发

jobs:
  # ===== 发现所有账号，构建矩阵 =====
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      last: ${{ steps.set-matrix.outputs.last }}
    steps:
    - name: 🎲 发现所有 KATABUMP_EML_x 账号
      id: set-matrix
      shell: bash
      env:
        ALL_SECRETS: ${{ toJson(secrets) }}
      run: |
        ACCOUNTS=$(echo "$ALL_SECRETS" | jq -r 'keys[] | select(startswith("KATABUMP_EML_"))' | sed 's/KATABUMP_EML_//' | shuf)
        if [ -z "$ACCOUNTS" ]; then
          # 兼容旧版：如果没有 KATABUMP_EML_x，尝试用单个账号
          echo "⚠️ 未检测到 KATABUMP_EML_x 格式 Secrets，尝试使用旧版单账号..."
          HAS_SINGLE=$(echo "$ALL_SECRETS" | jq 'has("KATABUMP_EMAIL")')
          if [ "$HAS_SINGLE" = "true" ]; then
            echo "matrix=[\"single\"]" >> $GITHUB_OUTPUT
            echo "last=single" >> $GITHUB_OUTPUT
          else
            echo "❌ 未检测到任何账号配置！请添加 KATABUMP_EML_1 / KATABUMP_PWD_1 等 Secrets"
            exit 1
          fi
        else
          INDEX_ARRAY=$(echo "$ACCOUNTS" | jq -R . | jq -s -c .)
          echo "matrix=$INDEX_ARRAY" >> $GITHUB_OUTPUT
          echo "last=$(echo "$ACCOUNTS" | awk 'END{print $NF}')" >> $GITHUB_OUTPUT
          echo "✅ 发现 $(echo "$ACCOUNTS" | wc -w) 个账号: $ACCOUNTS"
        fi

  # ===== 每个账号依次执行续期 =====
  renew:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    timeout-minutes: 60
    strategy:
      max-parallel: 1           # 串行执行，避免同时登录
      fail-fast: false           # 一个账号失败不影响其他
      matrix:
        account_index: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v6

    - name: ⚙ 设置 Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: 🛠️ 安装系统依赖和python依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: ⚙ 设置代理 (sing-box)
      continue-on-error: true
      env:
        NODE_LINK: ${{ secrets.NODE_LINK }}
      run: |
        bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

    - name: 🚀 运行账号 ${{ matrix.account_index }} 续期
      env:
        ACC: ${{ secrets[format('KATABUMP_EML_{0}', matrix.account_index)] || secrets.KATABUMP_EMAIL }}
        ACC_PWD: ${{ secrets[format('KATABUMP_PWD_{0}', matrix.account_index)] || secrets.KATABUMP_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        echo "📋 开始处理账号索引: ${{ matrix.account_index }}"
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 app.py

    # ★ 10分钟间隔：如果后面还有账号要执行才等待
    - name: ⏸️ 10分钟间隔等待 (防止封号)
      if: matrix.account_index != 'single' && matrix.account_index != needs.setup.outputs.last
      run: |
        echo "⏸️ 账号 ${{ matrix.account_index }} 续期完成，等待 10 分钟后执行下一个账号..."
        sleep 600

    - name: 🧹 清理旧的工作流运行记录
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
        count=0
        for run_id in $runs; do
          count=$((count + 1))
          if [ $count -gt 1 ]; then
            echo "删除运行记录: $run_id"
            gh run delete $run_id || true
          fi
        done